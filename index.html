<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1f12;
    --surface: #132018;
    --surface2: #1a2d1f;
    --surface3: #213526;
    --border: #2a4030;
    --border-hover: #3d5c47;
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.12);
    --accent-dim2: rgba(74,222,128,0.06);
    --text: #eef4f0;
    --text-muted: #7a9e84;
    --text-dim: #4a6e54;
    --danger: #f87171;
    --blue: #60c8a8;
    --sans: 'Outfit', sans-serif;
    --radius: 8px;
    --radius-lg: 14px;
    --theme-transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }

  :root.light {
    --bg: #f0f7f2;
    --surface: #ffffff;
    --surface2: #e8f4ec;
    --surface3: #d8eede;
    --border: #c0dcc8;
    --border-hover: #8ab89a;
    --accent: #16a34a;
    --accent-dim: rgba(22,163,74,0.10);
    --accent-dim2: rgba(22,163,74,0.05);
    --text: #0a1f0f;
    --text-muted: #3d6b4a;
    --text-dim: #7aaa88;
    --danger: #dc2626;
    --blue: #0891b2;
  }

  .theme-toggle {
    width: 36px; height: 36px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface3); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    padding: 0;
    transition: var(--theme-transition);
  }

  .header {
    padding: 32px 40px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    position: sticky; top: 0;
    background: var(--bg); z-index: 100; backdrop-filter: blur(12px);
  }
  .header-left { display: flex; flex-direction: column; gap: 6px; }
  .title-wrap { display: flex; align-items: center; gap: 12px; }
  .title {
    font-family: var(--sans); font-size: 22px; font-weight: 800;
    color: var(--text); letter-spacing: -0.5px; cursor: pointer;
    border: none; background: transparent; padding: 0; outline: none;
  }
  .title:hover { color: var(--accent); }
  .title-input {
    font-family: var(--sans); font-size: 22px; font-weight: 800;
    color: var(--accent); background: transparent; border: none;
    border-bottom: 1px solid var(--accent); outline: none; width: 260px; letter-spacing: -0.5px;
  }
  .subtitle { font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* SYNC STATUS */
  .sync-status {
    font-size: 11px; color: var(--text-dim);
    display: flex; align-items: center; gap: 5px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim); transition: background 0.3s;
  }
  .sync-dot.synced { background: var(--accent); }
  .sync-dot.syncing { background: #facc15; animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .btn {
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    padding: 8px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); cursor: pointer;
    transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); color: var(--text-muted); white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-hover); color: var(--text); }
  .btn-accent { background: var(--accent); color: #0a1f0f; border-color: var(--accent); font-weight: 600; }
  .btn-accent:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
  .btn-ghost:hover { color: var(--text-muted); background: var(--surface2); }
  .btn-danger { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); color: var(--danger); }
  .btn-danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
  .btn-sm { font-size: 11px; padding: 5px 10px; gap: 4px; }
  .btn-icon { padding: 7px; width: 34px; height: 34px; justify-content: center; font-size: 14px; }
  .btn-icon.btn-danger { width: 36px; height: 36px; }

  .toolbar {
    padding: 16px 40px; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; background: var(--bg); flex-wrap: wrap;
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
  .search-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px 8px 34px;
    color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--border-hover); }
  .search-input::placeholder { color: var(--text-dim); }
  .filter-select {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; color: var(--text-muted); font-family: var(--sans); font-size: 13px;
    outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  .filter-select:focus { border-color: var(--border-hover); }
  .count-badge { font-size: 11px; color: var(--text-dim); margin-left: auto; white-space: nowrap; }

  .table-wrap { padding: 24px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    white-space: nowrap; user-select: none; font-family: var(--sans);
  }
  th .th-inner { display: flex; align-items: center; gap: 6px; }
  th .col-label { cursor: pointer; transition: color 0.15s; border-bottom: 1px dashed transparent; }
  th .col-label:hover { color: var(--text-muted); border-bottom-color: var(--text-dim); }
  th .col-label-input {
    background: transparent; border: none; border-bottom: 1px solid var(--accent);
    color: var(--accent); font-family: var(--sans); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; outline: none; width: 100px;
  }
  th.col-url { width: 180px; }
  th.col-company { width: 160px; }
  th.col-actions { width: 80px; text-align: right; }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--accent-dim2); }
  td { padding: 14px 14px; font-size: 15px; vertical-align: middle; font-family: var(--sans); }

  .cell-text {
    color: var(--text); cursor: pointer; border-radius: 4px; padding: 2px 4px;
    transition: background 0.1s; display: inline-block; min-width: 60px; font-size: 15px;
  }
  .cell-text:hover { background: var(--surface3); }
  .cell-text.empty { color: var(--text-dim); font-style: italic; }

  .cell-input, .cell-textarea {
    background: var(--surface3); border: 1px solid var(--accent); border-radius: 4px;
    color: var(--text); font-family: var(--sans); font-size: 15px;
    padding: 4px 8px; outline: none; width: 100%; resize: none;
  }
  .cell-textarea { min-height: 60px; resize: vertical; }

  .url-cell { display: flex; align-items: center; gap: 6px; }
  .url-hidden { color: var(--text-dim); font-size: 12px; letter-spacing: 0.05em; }
  .url-visible { color: var(--blue); font-size: 12px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .company-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 20px; font-size: 13px; font-weight: 500;
    background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.1s; font-family: var(--sans);
  }
  .company-badge:hover { border-color: var(--border-hover); color: var(--text); }
  .company-select {
    background: var(--surface3); border: 1px solid var(--accent); border-radius: 4px;
    color: var(--text); font-family: var(--sans); font-size: 13px; padding: 5px 8px; outline: none; max-width: 160px;
  }

  td.col-actions { text-align: right; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 1; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 13px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px; width: 480px;
    max-width: 95vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .modal-title { font-family: var(--sans); font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
  .modal-section { margin-bottom: 20px; }
  .modal-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; }
  .company-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .company-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .company-item-input {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-family: var(--sans); font-size: 13px; outline: none;
  }
  .company-item-input:focus { color: var(--accent); }
  .company-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .color-picker { width: 28px; height: 28px; border: none; border-radius: 4px; cursor: pointer; padding: 0; background: transparent; }
  .modal-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; color: var(--text);
    font-family: var(--sans); font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface3); border: 1px solid var(--border-hover);
    border-radius: var(--radius); padding: 10px 16px; font-size: 12px; color: var(--text-muted);
    z-index: 9999; display: flex; align-items: center; gap: 8px;
    transform: translateY(60px); opacity: 0; transition: all 0.2s ease; pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .add-row-btn {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; width: 100%;
    border: 1px dashed var(--border); border-radius: var(--radius);
    background: transparent; color: var(--text-dim); font-family: var(--sans); font-size: 13px;
    cursor: pointer; transition: all 0.15s; margin-top: 8px;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); }

  @media (max-width: 768px) {
    .header { padding: 20px; }
    .toolbar { padding: 12px 20px; }
    .table-wrap { padding: 16px 20px; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
</style>
</head>
<body>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg">Saved!</span></div>

<div class="header">
  <div class="header-left">
    <div class="title-wrap">
      <span class="title" id="hub-title" onclick="editTitle()">Links Hub</span>
      <input class="title-input" id="hub-title-input" style="display:none" onblur="saveTitle()" onkeydown="if(event.key==='Enter')saveTitle()">
    </div>
    <div class="subtitle" id="hub-subtitle-display" onclick="editSubtitle()" style="cursor:pointer">Click to add a description...</div>
    <input class="modal-input" id="hub-subtitle-input" style="display:none;max-width:340px;font-size:11px;padding:4px 8px;margin-top:2px" onblur="saveSubtitle()" onkeydown="if(event.key==='Enter')saveSubtitle()">
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-label">Connecting...</span>
    </div>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode">🌿</button>
    <button class="btn" onclick="openCompanyManager()">⚙ Companies</button>
    <button class="btn btn-accent" onclick="addNewRow()">+ Add project</button>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="search-input" placeholder="Search projects..." oninput="filterTable()">
  </div>
  <select class="filter-select" id="filter-company" onchange="filterTable()">
    <option value="">All companies</option>
  </select>
  <span class="count-badge" id="row-count">0 projects</span>
</div>

<div class="table-wrap">
  <table id="links-table">
    <thead>
      <tr>
        <th><div class="th-inner"><span class="col-label" id="col-name-label" ondblclick="editColName('col-name')">Project Name</span></div></th>
        <th class="col-url"><div class="th-inner"><span class="col-label" id="col-url-label" ondblclick="editColName('col-url')">URL</span></div></th>
        <th><div class="th-inner"><span class="col-label" id="col-desc-label" ondblclick="editColName('col-desc')">Description</span></div></th>
        <th class="col-company"><div class="th-inner"><span class="col-label" id="col-company-label" ondblclick="editColName('col-company')">Company</span></div></th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <button class="add-row-btn" onclick="addNewRow()">＋ Add new project</button>
</div>

<div class="modal-overlay" id="company-modal">
  <div class="modal">
    <div class="modal-title">⚙ Manage Companies</div>
    <div class="modal-section">
      <div class="modal-label">Company List</div>
      <div class="company-list" id="company-list-ui"></div>
      <button class="btn btn-sm" onclick="addCompany()">+ Add company</button>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCompanyManager()">Close</button>
    </div>
  </div>
</div>

<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://rtqwpyscbqaldmnmdgdi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0cXdweXNjYnFhbGRtbm1kZ2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODA0MTUsImV4cCI6MjA5NTY1NjQxNX0.CODWl6v91SUuXryF-9V8L0AvHUKjLHOwjYmYhTvAtKY';

const headers = {
  'Content-Type': 'application/json',
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`
};

async function sbGet(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers });
  console.log(`[sbGet] ${table} → ${res.status} ${res.statusText}`);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPost(table, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST', headers: { ...headers, 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPatch(table, id, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH', headers: { ...headers, 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbDelete(table, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE', headers
  });
  if (!res.ok) throw new Error(await res.text());
}

async function sbGetSetting(key) {
  const rows = await sbGet('settings', `key=eq.${key}&select=value`);
  return rows.length ? rows[0].value : null;
}

async function sbSetSetting(key, value) {
  const existing = await sbGet('settings', `key=eq.${key}`);
  if (existing.length) {
    await fetch(`${SUPABASE_URL}/rest/v1/settings?key=eq.${key}`, {
      method: 'PATCH', headers, body: JSON.stringify({ value })
    });
  } else {
    await sbPost('settings', { key, value });
  }
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  title: 'Links Hub',
  subtitle: '',
  colNames: { 'col-name': 'Project Name', 'col-url': 'URL', 'col-desc': 'Description', 'col-company': 'Company' },
  companies: [],
  rows: []
};

function setSyncStatus(status, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot ' + status;
  lbl.textContent = label;
}

// ─── LOAD FROM SUPABASE ───────────────────────────────────────────────────────
async function loadFromSupabase() {
  setSyncStatus('syncing', 'Loading...');
  try {
    const [rows, companies, titleVal, subtitleVal, colNamesVal] = await Promise.all([
      sbGet('links', 'order=sort_order.asc,created_at.asc'),
      sbGet('companies', 'order=name.asc'),
      sbGetSetting('title'),
      sbGetSetting('subtitle'),
      sbGetSetting('col_names')
    ]);

    state.rows = rows.map(r => ({
      id: r.id, name: r.name || '', url: r.url || '',
      desc: r.description || '', company: r.company || '',
      urlVisible: false, sort_order: r.sort_order || 0
    }));

    state.companies = companies.map(c => ({ id: c.id, name: c.name, color: c.color }));

    if (titleVal) { state.title = titleVal; document.getElementById('hub-title').textContent = titleVal; document.title = titleVal; }
    if (subtitleVal) { state.subtitle = subtitleVal; document.getElementById('hub-subtitle-display').textContent = subtitleVal; }
    if (colNamesVal) {
      try {
        const cn = JSON.parse(colNamesVal);
        state.colNames = cn;
        Object.keys(cn).forEach(k => {
          const el = document.getElementById(k + '-label');
          if (el) el.textContent = cn[k];
        });
      } catch(e) {}
    }

    updateFilterDropdown();
    renderTable();
    setSyncStatus('synced', 'Synced');
  } catch(e) {
    setSyncStatus('error', 'Error');
    showToast('Failed to load data');
    console.error(e);
  }
}

// ─── TITLE ────────────────────────────────────────────────────────────────────
function editTitle() {
  const t = document.getElementById('hub-title');
  const i = document.getElementById('hub-title-input');
  t.style.display = 'none'; i.style.display = '';
  i.value = state.title; i.focus(); i.select();
}
async function saveTitle() {
  const i = document.getElementById('hub-title-input');
  state.title = i.value.trim() || 'Links Hub';
  document.getElementById('hub-title').textContent = state.title;
  document.getElementById('hub-title').style.display = '';
  i.style.display = 'none';
  document.title = state.title;
  await sbSetSetting('title', state.title);
}

function editSubtitle() {
  const d = document.getElementById('hub-subtitle-display');
  const i = document.getElementById('hub-subtitle-input');
  d.style.display = 'none'; i.style.display = '';
  i.value = state.subtitle; i.focus();
}
async function saveSubtitle() {
  const i = document.getElementById('hub-subtitle-input');
  state.subtitle = i.value.trim();
  const d = document.getElementById('hub-subtitle-display');
  d.textContent = state.subtitle || 'Click to add a description...';
  d.style.display = ''; i.style.display = 'none';
  await sbSetSetting('subtitle', state.subtitle);
}

// ─── COLUMN NAMES ─────────────────────────────────────────────────────────────
function editColName(key) {
  const el = document.getElementById(key + '-label');
  const input = document.createElement('input');
  input.className = 'col-label-input';
  input.value = state.colNames[key];
  input.onblur = () => saveColName(key, input);
  input.onkeydown = (e) => { if (e.key === 'Enter') saveColName(key, input); };
  el.replaceWith(input); input.focus(); input.select();
}
async function saveColName(key, input) {
  state.colNames[key] = input.value.trim() || state.colNames[key];
  const span = document.createElement('span');
  span.className = 'col-label'; span.id = key + '-label';
  span.textContent = state.colNames[key];
  span.ondblclick = () => editColName(key);
  input.replaceWith(span);
  await sbSetSetting('col_names', JSON.stringify(state.colNames));
}

// ─── COMPANIES ───────────────────────────────────────────────────────────────
function getCompany(id) { return state.companies.find(c => c.id === id) || null; }

function openCompanyManager() { renderCompanyList(); document.getElementById('company-modal').classList.add('open'); }

async function closeCompanyManager() {
  document.getElementById('company-modal').classList.remove('open');
  renderTable(); updateFilterDropdown();
}

function renderCompanyList() {
  const ul = document.getElementById('company-list-ui');
  ul.innerHTML = '';
  state.companies.forEach((c, idx) => {
    const item = document.createElement('div');
    item.className = 'company-item';
    item.innerHTML = `
      <span class="company-color-dot" style="background:${c.color}"></span>
      <input class="company-item-input" value="${escHtml(c.name)}"
        oninput="state.companies[${idx}].name = this.value"
        onblur="updateCompany('${c.id}')">
      <input type="color" class="color-picker" value="${c.color}"
        oninput="state.companies[${idx}].color = this.value; this.previousElementSibling.previousElementSibling.style.background = this.value"
        onblur="updateCompany('${c.id}')">
      <button class="btn btn-icon btn-danger" onclick="removeCompany('${c.id}')" title="Remove">✕</button>
    `;
    ul.appendChild(item);
  });
}

async function updateCompany(id) {
  const c = state.companies.find(x => x.id === id);
  if (!c) return;
  setSyncStatus('syncing', 'Saving...');
  try {
    await sbPatch('companies', id, { name: c.name, color: c.color });
    setSyncStatus('synced', 'Synced');
  } catch(e) { setSyncStatus('error', 'Error'); }
}

async function addCompany() {
  const newC = { name: 'New Company', color: '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0') };
  setSyncStatus('syncing', 'Saving...');
  try {
    const [created] = await sbPost('companies', newC);
    state.companies.push({ id: created.id, name: created.name, color: created.color });
    renderCompanyList();
    setSyncStatus('synced', 'Synced');
  } catch(e) { setSyncStatus('error', 'Error'); showToast('Failed to add company'); }
}

async function removeCompany(id) {
  state.companies = state.companies.filter(c => c.id !== id);
  state.rows.forEach(r => { if (r.company === id) r.company = ''; });
  setSyncStatus('syncing', 'Saving...');
  try {
    await sbDelete('companies', id);
    renderCompanyList();
    setSyncStatus('synced', 'Synced');
  } catch(e) { setSyncStatus('error', 'Error'); }
}

function updateFilterDropdown() {
  const sel = document.getElementById('filter-company');
  const current = sel.value;
  sel.innerHTML = '<option value="">All companies</option>';
  state.companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
  sel.value = current;
}

// ─── TABLE RENDER ─────────────────────────────────────────────────────────────
function renderTable(filter = '') {
  const tbody = document.getElementById('table-body');
  const compFilter = document.getElementById('filter-company').value;
  tbody.innerHTML = '';
  let visible = state.rows.filter(r => {
    const q = filter.toLowerCase();
    const matchQ = !q || r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || r.url.toLowerCase().includes(q);
    const matchC = !compFilter || r.company === compFilter;
    return matchQ && matchC;
  });
  document.getElementById('row-count').textContent = visible.length + ' project' + (visible.length !== 1 ? 's' : '');
  if (visible.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">🌿</div><p>No projects found. Add one above!</p></div></td></tr>`;
    return;
  }
  visible.forEach(row => {
    const tr = document.createElement('tr');
    tr.id = 'row-' + row.id;
    tr.innerHTML = buildRowHTML(row);
    tbody.appendChild(tr);
  });
}

function buildRowHTML(row) {
  const comp = getCompany(row.company);
  const compBadge = comp
    ? `<span class="company-badge" style="border-color:${comp.color}22;background:${comp.color}11;color:${comp.color}" onclick="editCompanyCell('${row.id}')">
        <span style="width:6px;height:6px;border-radius:50%;background:${comp.color};display:inline-block;flex-shrink:0"></span>
        ${escHtml(comp.name)}</span>`
    : `<span class="company-badge" onclick="editCompanyCell('${row.id}')">— assign</span>`;

  const urlContent = row.urlVisible
    ? `<span class="url-visible" title="${escHtml(row.url)}">${escHtml(row.url)}</span>
       <div class="url-actions">
         <button class="btn btn-icon btn-ghost btn-sm" title="Hide URL" onclick="toggleUrl('${row.id}')">◉</button>
         <button class="btn btn-icon btn-ghost btn-sm" title="Copy URL" onclick="copyUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
         <button class="btn btn-icon btn-ghost btn-sm" title="Open URL" onclick="openUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
       </div>`
    : `<span class="url-hidden">••••••••</span>
       <div class="url-actions">
         <button class="btn btn-icon btn-ghost btn-sm" title="Reveal URL" onclick="toggleUrl('${row.id}')">👁</button>
         <button class="btn btn-icon btn-ghost btn-sm" title="Copy URL" onclick="copyUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
         <button class="btn btn-icon btn-ghost btn-sm" title="Open URL" onclick="openUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
       </div>`;

  return `
    <td onclick="editCell('${row.id}','name',this)">
      <span class="cell-text ${!row.name?'empty':''}">${escHtml(row.name) || 'Click to add...'}</span>
    </td>
    <td><div class="url-cell" id="url-cell-${row.id}">${urlContent}</div></td>
    <td onclick="editCell('${row.id}','desc',this)">
      <span class="cell-text ${!row.desc?'empty':''}">${escHtml(row.desc) || 'Click to add...'}</span>
    </td>
    <td id="company-cell-${row.id}">${compBadge}</td>
    <td class="col-actions">
      <div class="row-actions">
        <button class="btn btn-icon btn-danger btn-sm" title="Delete" onclick="deleteRow('${row.id}')">✕</button>
      </div>
    </td>`;
}

// ─── CELL EDITING ─────────────────────────────────────────────────────────────
function editCell(rowId, field, tdEl) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row) return;
  const isDesc = field === 'desc';
  const el = isDesc ? document.createElement('textarea') : document.createElement('input');
  el.className = isDesc ? 'cell-textarea' : 'cell-input';
  el.value = row[field];
  el.onclick = e => e.stopPropagation();
  el.onblur = async () => {
    const newVal = el.value.trim();
    if (newVal === row[field]) { renderTable(document.getElementById('search-input').value); return; }
    row[field] = newVal;
    await saveRow(row);
    renderTable(document.getElementById('search-input').value);
  };
  el.onkeydown = e => {
    if (e.key === 'Enter' && !isDesc) { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.value = row[field]; el.blur(); }
  };
  tdEl.innerHTML = ''; tdEl.appendChild(el); el.focus();
  if (!isDesc) el.select();
}

function editCompanyCell(rowId) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row) return;
  const td = document.getElementById('company-cell-' + rowId);
  const sel = document.createElement('select');
  sel.className = 'company-select';
  sel.innerHTML = '<option value="">— none —</option>';
  state.companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    if (c.id === row.company) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = async () => {
    row.company = sel.value;
    await saveRow(row);
    renderTable(document.getElementById('search-input').value);
  };
  sel.onblur = () => renderTable(document.getElementById('search-input').value);
  td.innerHTML = ''; td.appendChild(sel); sel.focus();
}

async function saveRow(row) {
  setSyncStatus('syncing', 'Saving...');
  try {
    await sbPatch('links', row.id, {
      name: row.name, url: row.url,
      description: row.desc, company: row.company
    });
    setSyncStatus('synced', 'Synced');
  } catch(e) { setSyncStatus('error', 'Error'); showToast('Failed to save'); }
}

// ─── URL ACTIONS ─────────────────────────────────────────────────────────────
function toggleUrl(rowId) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row) return;
  if (!row.url && !row.urlVisible) { editUrlInline(rowId); return; }
  row.urlVisible = !row.urlVisible;
  const cell = document.getElementById('url-cell-' + rowId);
  if (cell) cell.innerHTML = buildUrlCellContent(row);
}

function buildUrlCellContent(row) {
  const copyBtn = `<button class="btn btn-icon btn-ghost btn-sm" title="Copy URL" onclick="copyUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
  const openBtn = `<button class="btn btn-icon btn-ghost btn-sm" title="Open URL" onclick="openUrl('${row.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>`;
  if (row.urlVisible) {
    return `<span class="url-visible" title="${escHtml(row.url)}">${escHtml(row.url)}</span>
            <div class="url-actions">
              <button class="btn btn-icon btn-ghost btn-sm" title="Hide URL" onclick="toggleUrl('${row.id}')">◉</button>
              ${copyBtn}${openBtn}
            </div>`;
  }
  return `<span class="url-hidden">••••••••</span>
          <div class="url-actions">
            <button class="btn btn-icon btn-ghost btn-sm" title="Reveal URL" onclick="toggleUrl('${row.id}')">👁</button>
            ${copyBtn}${openBtn}
          </div>`;
}

function editUrlInline(rowId) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row) return;
  const cell = document.getElementById('url-cell-' + rowId);
  cell.innerHTML = '';
  const inp = document.createElement('input');
  inp.className = 'cell-input'; inp.value = row.url; inp.placeholder = 'https://...'; inp.style.fontSize = '12px';
  inp.onblur = async () => {
    row.url = inp.value.trim(); row.urlVisible = false;
    await saveRow(row);
    cell.innerHTML = buildUrlCellContent(row);
  };
  inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  cell.appendChild(inp); inp.focus();
}

document.addEventListener('dblclick', e => {
  const cell = e.target.closest('.url-visible');
  if (!cell) return;
  const urlCell = cell.closest('[id^="url-cell-"]');
  if (!urlCell) return;
  editUrlInline(urlCell.id.replace('url-cell-', ''));
});

function copyUrl(rowId) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row || !row.url) { showToast('No URL to copy'); return; }
  navigator.clipboard.writeText(row.url).then(() => showToast('URL copied!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = row.url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('URL copied!');
  });
}

function openUrl(rowId) {
  const row = state.rows.find(r => r.id === rowId);
  if (!row || !row.url) { showToast('No URL set'); return; }
  window.open(row.url, '_blank');
}

// ─── ROW MANAGEMENT ──────────────────────────────────────────────────────────
async function addNewRow() {
  setSyncStatus('syncing', 'Saving...');
  try {
    const [created] = await sbPost('links', { name: '', url: '', description: '', company: '', sort_order: 0 });
    const row = { id: created.id, name: '', url: '', desc: '', company: '', urlVisible: false, sort_order: 0 };
    state.rows.unshift(row);
    renderTable(document.getElementById('search-input').value);
    setSyncStatus('synced', 'Synced');
    setTimeout(() => {
      const nameCell = document.querySelector(`#row-${row.id} td:first-child`);
      if (nameCell) nameCell.click();
    }, 50);
  } catch(e) { setSyncStatus('error', 'Error'); showToast('Failed to add project'); }
}

async function deleteRow(rowId) {
  if (!confirm('Delete this project? This cannot be undone.')) return;
  state.rows = state.rows.filter(r => r.id !== rowId);
  renderTable(document.getElementById('search-input').value);
  setSyncStatus('syncing', 'Saving...');
  try {
    await sbDelete('links', rowId);
    setSyncStatus('synced', 'Synced');
  } catch(e) { setSyncStatus('error', 'Error'); }
}

// ─── FILTER ──────────────────────────────────────────────────────────────────
function filterTable() { renderTable(document.getElementById('search-input').value); }

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── THEME ───────────────────────────────────────────────────────────────────
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌿';
  try { localStorage.setItem('links_hub_theme', isLight ? 'light' : 'dark'); } catch(e) {}
}
function applyTheme() {
  try {
    const saved = localStorage.getItem('links_hub_theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
      document.getElementById('theme-btn').textContent = '☀️';
    }
  } catch(e) {}
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── INIT ────────────────────────────────────────────────────────────────────
applyTheme();
document.getElementById('company-modal').addEventListener('click', function(e) {
  if (e.target === this) closeCompanyManager();
});
loadFromSupabase();
</script>
